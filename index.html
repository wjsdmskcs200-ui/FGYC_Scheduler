<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b5bdb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영산교회">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>순복음 영산교회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light dark;
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#faf9f6; --ink:#1d2130; --muted:#6b7183; --line:#e6e2d8;
  --accent:#3b5bdb; --accent-ink:#ffffff; --accent-soft:#e8edff;
  --ok:#2f9e6b; --ok-soft:#e1f5ec; --warn:#c26d12; --warn-soft:#fdf0e0; --bad:#d6403f; --bad-soft:#fde8e8;
  --hl:#fff3bf;
  --shadow:0 1px 2px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.07);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14161d; --surface:#1c1f29; --surface2:#222633; --ink:#eceef5; --muted:#9aa1b5; --line:#2c3040;
    --accent:#7c93ff; --accent-ink:#10142a; --accent-soft:#252c52;
    --ok:#52c68f; --ok-soft:#183328; --warn:#f0a85a; --warn-soft:#3a2b17; --bad:#ff7b7a; --bad-soft:#3d2022;
    --hl:#4a4015;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
body{overflow-x:clip}
body.lock{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.grow{flex:1}
body.role-user .mo{display:none!important}

/* ---------- buttons / inputs ---------- */
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface2);border-color:color-mix(in srgb,var(--muted) 40%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.danger{color:var(--bad)}
.btn.dangerfill{background:var(--bad);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--bad-soft)}
.btn.ghost.neutral:hover{background:var(--surface)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.icon{padding:9px 12px;line-height:1}
.btn[disabled]{opacity:.55;pointer-events:none}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.in:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea.in{min-height:130px;resize:vertical}
input[type=date].in,input[type=time].in{display:block;min-width:0;max-width:100%;min-height:42px}
select.in{appearance:auto}

/* ---------- login ---------- */
#login{min-height:100dvh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:38px 30px 26px;box-shadow:var(--shadow)}
.login-card.shake{animation:shake .35s}
.logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:24px;margin-bottom:18px}
.login-card h1{font-size:24px;letter-spacing:-.02em}
.login-card>p{color:var(--muted);margin:4px 0 24px}
.fld{margin-bottom:14px}
.fld>label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.login-err{min-height:20px;color:var(--bad);font-size:13px;margin:4px 0 10px}
.login-card .btn.primary{width:100%;padding:12px}
.login-card .linkbtn{width:100%;margin-top:8px;color:var(--muted);font-weight:500;font-size:14px}
.chk{display:flex;align-items:center;gap:9px;font-weight:600;cursor:pointer;padding:6px 0 8px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .logo{width:38px;height:38px;border-radius:11px;font-size:19px;margin:0}
.brand b{display:block;font-size:17px;letter-spacing:-.02em;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 15px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(20,24,40,.12)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:20}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--surface2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* ---------- toolbar ---------- */
main.wrap{padding-top:20px;padding-bottom:60px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-right:auto}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.chip em{font-style:normal;margin-left:7px;font-size:12px;opacity:.8}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#q{max-width:260px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tools:empty{display:none}

/* ---------- badges ---------- */
.bd{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.bd.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.bd.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bd.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.bd.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bd.new{background:var(--bad);color:#fff;border-color:transparent;font-size:10px;padding:1px 7px;margin-right:6px;vertical-align:1px}

/* ---------- check button ---------- */
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;color:transparent;display:inline-grid;place-items:center;font-size:13px;font-weight:800;padding:0;transition:all .15s}
button.check:hover{border-color:var(--ok);color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.check.ro{pointer-events:none}

/* ---------- table view ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.tbl{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;overflow:hidden}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:var(--surface2)}
.tbl tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl td.hl{background:var(--hl)}
.tbl tr.row:hover td.hl{background:var(--hl)}
.c-chk{width:56px} .c-date,.c-d1{width:150px} .c-cat{width:120px} .c-d2{width:200px} .c-st{width:110px}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.past{opacity:.62}
.dt{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.dt.late{color:var(--bad);font-weight:700}
.dt.today{color:var(--warn);font-weight:700}
.who{font-weight:650}
.tm{color:var(--muted);font-size:14px;white-space:nowrap}

/* ---------- empty ---------- */
.empty{text-align:center;color:var(--muted);padding:64px 16px}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin-top:16px}
.foot-me{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,12,20,.52);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
.overlay.l2{z-index:60}
.dialog{width:100%;max-width:520px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .18s}
.dlg-head{display:flex;align-items:center;padding:16px 18px 6px 22px}
.dlg-head h2{font-size:15px;color:var(--muted);font-weight:700;margin-right:auto}
.x{border:0;background:transparent;border-radius:50%;width:32px;height:32px;color:var(--muted)}
.x:hover{background:var(--surface2)}
.dlg-body{padding:6px 22px 18px;overflow:auto}
.dlg-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inl{display:flex;gap:8px;align-items:center}
.inl .in{flex:1;min-width:0}
.ferr{color:var(--bad);font-size:13px;min-height:18px}
.d-title{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.35;word-break:break-word}
.d-title.done{text-decoration:line-through;color:var(--muted)}
.d-badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 16px}
.meta{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;margin:0 0 16px;font-size:14px}
.meta dt{color:var(--muted);font-weight:600}
.meta dd{margin:0}
.d-content{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;white-space:pre-wrap;word-break:break-word;min-height:72px}
.qps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qp{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.qp:hover{background:var(--accent-soft);color:var(--accent)}
.rd{display:flex;gap:8px}
.rd label{flex:1;position:relative}
.rd input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.rd span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-weight:600;color:var(--muted);background:var(--surface)}
.rd input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.rd input:focus-visible+span{outline:2px solid var(--accent);outline-offset:1px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.item.sel{background:var(--accent-soft);border-color:var(--accent)}
.item b{color:var(--muted);width:22px;font-weight:700}
.item span{flex:1}
.note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6}
.mem{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.mem .l1{font-weight:700}
.mem .l2{color:var(--muted);font-size:13px;margin:2px 0 8px}
.mem .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mem select{width:auto}
.ptbl{width:100%;border-collapse:collapse;font-size:14px}
.ptbl th{text-align:left;font-size:12px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}
.ptbl td{padding:9px 6px;border-bottom:1px solid var(--line)}

/* ---------- toast ---------- */
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:100;pointer-events:none;width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);animation:pop .2s;max-width:420px;white-space:pre-line;text-align:left}
.toast.bad{background:var(--bad);color:#fff}

@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

@media (max-width:640px){
  .wrap{padding:0 14px}
  main.wrap{padding-top:14px}
  .in{font-size:16px}               /* iOS 입력창 자동 확대 방지 */
  .row2{grid-template-columns:1fr 1fr}
  .row2>*{min-width:0}
  .brand small{display:none}
  .tb{gap:10px;padding:10px 0}
  .seg{order:3;width:100%}           /* 탭은 둘째 줄에 꽉 차게 */
  .seg button{flex:1;padding:6px 4px}
  #q{max-width:none;width:100%}
  .chips{width:100%}
  .chip{flex:1;text-align:center;padding:6px 8px}
  .overlay{padding:12px}
  .dlg-body{padding:6px 18px 16px}
  .dlg-foot{padding:12px 18px}

  /* 표 → 카드형 목록 (가로 스크롤 없음) */
  .tablecard{background:transparent;border:0;box-shadow:none;overflow:visible}
  .tbl,.tbl tbody{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr.row{display:grid;column-gap:12px;row-gap:7px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:12px 14px;margin-bottom:10px}
  .tbl td{display:block;padding:0;border:0;min-width:0;width:auto}
  .tbl tr.row:hover td{background:transparent}
  .tbl td.hl,.tbl tr.row:hover td.hl{background:var(--hl);border-radius:6px;padding:1px 6px;margin:-1px -6px}
  .t-sch tr.row{grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"chk title title title" "chk date cat st"}
  .t-duty tr.row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"d1 d1 st" "d3 d2 d2"}
  .t-pray tr.row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"d1 st" "d3 d3"}
  .tbl td.c-chk{grid-area:chk;align-self:center}
  .tbl td.c-title{grid-area:title}
  .tbl td.c-date{grid-area:date;font-size:13px}
  .tbl td.c-cat{grid-area:cat}
  .tbl td.c-d1{grid-area:d1;font-size:13px}
  .tbl td.c-d2{grid-area:d2}
  .tbl td.c-d3{grid-area:d3}
  .tbl td.c-st{grid-area:st}
  .tbl .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
  .who{font-size:16px}
}
</style>
</head>
<body>

<!-- ===== 로그인 / 회원가입 ===== -->
<div id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="logo">✝</div>
    <h1>순복음 영산교회</h1>
    <p>스케줄 · 당직 · 기도 담당 관리</p>
    <div class="fld"><label for="lid">아이디</label><input class="in" id="lid" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="30" required></div>
    <div class="fld"><label for="lpw">비밀번호</label><input class="in" id="lpw" name="password" type="password" autocomplete="current-password" required></div>
    <div id="suFields" hidden>
      <div class="fld"><label for="lpw2">비밀번호 확인</label><input class="in" id="lpw2" type="password" autocomplete="new-password"></div>
      <div class="fld"><label for="lpos">직분</label><input class="in" id="lpos" maxlength="20" placeholder="예: 집사, 권사, 장로"></div>
      <div class="fld"><label for="ltel">전화번호</label><input class="in" id="ltel" type="tel" maxlength="20" placeholder="010-0000-0000"></div>
    </div>
    <label class="chk"><input type="checkbox" id="lauto" checked> 자동 로그인</label>
    <div class="login-err" id="loginErr" role="alert"></div>
    <button class="btn primary" type="submit" id="loginBtn">로그인</button>
    <button class="btn ghost neutral linkbtn" type="button" id="loginSwitch">계정이 없으신가요? 회원가입</button>
  </form>
</div>

<!-- ===== 앱 ===== -->
<div id="app" hidden>
  <header class="topbar">
    <div class="wrap tb">
      <div class="brand">
        <div class="logo">✝</div>
        <div><b>순복음 영산교회</b><small id="todayLabel"></small></div>
      </div>
      <div class="seg" role="tablist" aria-label="메뉴">
        <button data-view="sch" role="tab">스케줄 관리</button>
        <button data-view="duty" role="tab">당직 관리</button>
        <button data-view="pray" role="tab">기도 담당자</button>
      </div>
      <button class="btn primary mo" data-new id="btnNew">＋ 새 일정</button>
      <div class="menu-wrap">
        <button class="btn icon" id="btnMenu" aria-label="더보기" aria-haspopup="true">⋯</button>
        <div class="menu" id="menu" hidden>
          <button data-act="refresh">새로고침</button>
          <button data-act="notify">알림 허용</button>
          <button data-act="members" id="menuMembers" hidden>회원 관리</button>
          <hr>
          <button data-act="logout">로그아웃</button>
        </div>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <input class="in" id="q" type="search" placeholder="검색" aria-label="검색">
    </div>
    <div class="tools" id="tools"></div>
    <section id="view" aria-live="polite"></section>
    <div class="foot-me"><span id="meInfo"></span><span class="grow"></span><button class="btn sm" data-act="logout">로그아웃</button></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="modalRoot2"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
'use strict';

/* =====================  설정  ===================== */
const CFG = {
  url: 'https://qqmebndptbrvlzlkklxn.supabase.co',
  key: 'sb_publishable_OPDTpDVMK7xwzLcArD7xNw_lWpkXl6x'
};

/* =====================  유틸  ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const pad = n => String(n).padStart(2,'0');
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => toStr(new Date());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const DOW = ['일','월','화','수','목','금','토'];
const wday = s => s ? DOW[parse(s).getDay()] : '';
const fmt = s => { if (!s) return ''; const d = parse(s); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} (${DOW[d.getDay()]})`; };
const dot = s => s ? s.replaceAll('-', '.') : '';
const diffDays = s => Math.round((parse(s) - parse(today())) / 86400000);
const addDays = (n, base) => { const d = base ? new Date(base) : new Date(); d.setDate(d.getDate() + n); return d; };
const fmtT = t => {
  if (!t) return '';
  let [h, m] = t.split(':').map(Number);
  const ap = h < 12 ? '오전' : '오후';
  h = h % 12 || 12;
  return `${ap} ${h}:${pad(m)}`;
};
const clip = (s, n = 80) => { s = (s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };

function toast(msg, type = ''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), type === 'bad' ? 5000 : 2400);
}

/* =====================  로그인 토큰 / Supabase  ===================== */
// 자동 로그인 ON 이면 localStorage, OFF 이면 sessionStorage(브라우저를 닫으면 로그아웃)
const store = {
  get(){ try { return localStorage.getItem('sess') || sessionStorage.getItem('sess'); } catch { return null; } },
  set(tok, persist){ try { localStorage.removeItem('sess'); sessionStorage.removeItem('sess'); (persist ? localStorage : sessionStorage).setItem('sess', tok); } catch {} },
  clear(){ try { localStorage.removeItem('sess'); sessionStorage.removeItem('sess'); } catch {} }
};
let TOKEN = store.get();
// 모든 DB 요청에 로그인 토큰을 헤더로 실어 보냄 (DB 쪽에서 마스터 여부를 확인)
const authFetch = (url, opt = {}) => {
  const h = new Headers(opt.headers || {});
  if (TOKEN) h.set('x-session-token', TOKEN);
  return fetch(url, { ...opt, headers: h });
};
const sb = window.supabase
  ? window.supabase.createClient(CFG.url, CFG.key, { global: { fetch: authFetch }, auth: { persistSession: false, autoRefreshToken: false } })
  : null;

async function run(q){
  const { data, error } = await q;
  if (error){ toast('오류: ' + error.message, 'bad'); throw error; }
  return data;
}
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if (error) throw error;
  return data;
}
// 수정/삭제가 DB 권한 때문에 0건 처리되면(로그인 만료 등) 알려줌
async function mutate(q){
  const rows = await run(q.select());
  if (!rows || !rows.length){
    toast('저장되지 않았어요. 로그인 상태나 권한을 확인해 주세요.', 'bad'); refreshMe();
    throw new Error('no rows');
  }
  return rows;
}

/* ---- NEW 배지 / 수정 하이라이트 ---- */
const CID = (() => { let v = ls.get('cid'); if (!v){ v = Math.random().toString(36).slice(2); ls.set('cid', v); } return v; })();
const H24 = 24 * 3600 * 1000;
const isNew = r => r.created_at && Date.now() - new Date(r.created_at) < H24;
const recentEdit = r => r.updated_at && Date.now() - new Date(r.updated_at) < H24;
const hl = (r, ...fs) => (recentEdit(r) && fs.some(f => (r.changed_fields || []).includes(f))) ? 'hl' : '';
const newBadge = r => isNew(r) ? '<span class="bd new">NEW</span>' : '';
function editMeta(old, p){
  const ch = Object.keys(p).filter(k => (old[k] ?? '') != (p[k] ?? ''));
  if (!ch.length) return null;
  const prev = recentEdit(old) ? (old.changed_fields || []) : [];
  return { changed_fields: [...new Set([...prev, ...ch])], updated_at: new Date().toISOString(), updated_by: CID };
}

async function loadDuty(){

async function loadPray(){

/* =====================  목록 계산  ===================== */
const catName = id => (state.cats.find(c => c.id === id) || {}).name || '';
const prNames = r => [r.worker1, r.worker2].filter(Boolean).join(', ');
const needle = () => state.q.trim().toLowerCase();

function schList(){
  const q = needle(), done = state.schFilter === 'done';
  const order = {}; state.cats.forEach((c, i) => order[c.id] = i);
  const rank = r => r.category_id in order ? order[r.category_id] : 9999;
  const dir = done ? -1 : 1;
  const dd = r => r.due_date || (dir === 1 ? '9999-12-31' : '0000-00-00');   // 마감일 없는 옛 데이터는 맨 뒤
  return state.sch
    .filter(r => r.done === done && (!q || `${r.title} ${r.content || ''} ${catName(r.category_id)}`.toLowerCase().includes(q)))
    .sort((a, b) => dir * dd(a).localeCompare(dd(b)) || rank(a) - rank(b) || a.id - b.id);
}
function dutyList(){
  const q = needle(), t = today(), f = state.dutyFilter;
  let l = state.duties.filter(r =>
    (f === 'all' || (f === 'upcoming' ? r.duty_date >= t : r.duty_date < t)) &&
    (!q || `${r.worker_name} ${dot(r.duty_date)}`.toLowerCase().includes(q)));
  if (f === 'past') l = [...l].reverse();
  return l;
}
function prayList(cat = state.prayCat){
  const q = needle(), t = today();
  return state.prRows
    .filter(r => r.category === cat && r.pray_date >= t && (!q || `${prNames(r)} ${dot(r.pray_date)}`.toLowerCase().includes(q)))
    .sort((a, b) => a.pray_date.localeCompare(b.pray_date) || a.id - b.id);
}

/* =====================  렌더링  ===================== */
function dayBadge(s){
  const d = diffDays(s);
  if (d < 0) return '<span class="bd">지난</span>';
  if (d === 0) return '<span class="bd warn">오늘</span>';
  return `<span class="bd ${d <= 3 ? 'warn' : ''}">D-${d}</span>`;
}
function schBadge(r){
  if (r.done) return '<span class="bd ok">완료</span>';
  if (!r.due_date) return '';
  const d = diffDays(r.due_date);
  if (d < 0) return `<span class="bd bad">지연 D+${-d}</span>`;
  if (d === 0) return '<span class="bd warn">오늘</span>';
  return `<span class="bd ${d <= 3 ? 'warn' : ''}">D-${d}</span>`;
}
const emptyHtml = (h, p) => `<div class="empty"><h3>${h}</h3><p>${p || ''}</p></div>`;

function renderSch(){
  const list = schList();
  if (!list.length){
    return state.sch.length || state.q
      ? emptyHtml('조건에 맞는 일정이 없어요', '검색어나 필터를 바꿔 보세요.')
      : `<div class="empty"><h3>아직 등록된 일정이 없어요</h3><p>첫 일정을 추가해 보세요.</p>${isMaster() ? '<button class="btn primary" data-new>＋ 새 일정</button>' : ''}</div>`;
  }
  const rows = list.map(r => {
    const dc = !r.done && r.due_date ? (diffDays(r.due_date) < 0 ? 'late' : diffDays(r.due_date) === 0 ? 'today' : '') : '';
    const chk = isMaster()
      ? `<button class="check ${r.done ? 'on' : ''}" data-toggle="${r.id}" aria-label="${r.done ? '완료 해제' : '완료 처리'}" title="${r.done ? '완료 해제' : '완료 처리'}">✓</button>`
      : `<span class="check ro ${r.done ? 'on' : ''}">✓</span>`;
    const cn = catName(r.category_id);
    return `<tr class="row ${r.done ? 'done' : ''}" data-open="${r.id}" data-kind="sch" tabindex="0">
      <td class="c-chk">${chk}</td>
      <td class="c-date dt ${dc} ${hl(r, 'due_date')}">${r.due_date ? fmt(r.due_date) : '-'}</td>
      <td class="c-cat ${hl(r, 'category_id')}">${cn ? `<span class="bd acc">${esc(cn)}</span>` : ''}</td>
      <td class="c-title ${hl(r, 'title', 'content')}"><div class="t">${newBadge(r)}${esc(r.title)}</div></td>
      <td class="c-st">${schBadge(r)}</td>

  }).join('');
  return `<div class="card tablecard"><table class="tbl t-sch">
    <thead><tr><th class="c-chk"></th><th class="c-date">마감일</th><th class="c-cat">항목</th><th>제목</th><th class="c-st">상태</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function renderDuty(){

    return state.duties.length || state.q
      ? emptyHtml('조건에 맞는 당직이 없어요', '필터를 바꿔 보세요.')
      : `<div class="empty"><h3>등록된 당직이 없어요</h3><p>당직자를 등록하고 일정을 만들어 보세요.</p>${isMaster() ? '<button class="btn primary" data-new>＋ 새 당직</button>' : ''}</div>`;

function renderPray(){
  const list = prayList();
  if (!list.length){
    return emptyHtml(`${state.prayCat} 일정이 없어요`, '오늘 이후로 등록된 일정이 없습니다.') +

  return `<div class="card tablecard"><table class="tbl t-pray">

    <tbody>${rows}</tbody></table></div>`;
}

function render(){

  $('#todayLabel').textContent = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  document.querySelectorAll('[data-view]').forEach(b => {

  // 칩
  const t = today();
  let chips = [];
  if (state.tab === 'sch'){
    const n = state.sch.filter(r => !r.done).length;
    chips = [['open', '미완', n, state.schFilter], ['done', '완료', state.sch.length - n, state.schFilter]];
  } else if (state.tab === 'duty'){
    const up = state.duties.filter(r => r.duty_date >= t).length;
    chips = [['upcoming', '예정', up, state.dutyFilter], ['past', '지난', state.duties.length - up, state.dutyFilter], ['all', '전체', state.duties.length, state.dutyFilter]];
  } else {
    chips = ['새벽기도', '저녁기도'].map(c => [c, c, prayList(c).length, state.prayCat]);
  }
  $('#chips').innerHTML = chips.map(([k, l, n, cur]) => `<button class="chip ${cur === k ? 'on' : ''}" data-filter="${k}">${l}<em>${n}</em></button>`).join('');

  // 도구 버튼
  const m = isMaster();
  $('#tools').innerHTML = state.tab === 'sch'
    ? (m ? '<button class="btn sm" data-act="cats">항목 관리 · 우선순위</button>' : '')
    : state.tab === 'duty'
    ? (m ? '<button class="btn sm" data-act="roster-duty">당직자 명단 · 순서</button><button class="btn sm" data-act="gen-duty">월요일 일괄 생성</button>' : '')
    : (m ? '<button class="btn sm" data-act="roster-pray">담당자 명단 · 순서</button><button class="btn sm" data-act="gen-pray">기간 일괄 생성</button>' : '') +
      '<button class="btn sm" data-act="past-pray">🕘 지난 2주 보기</button>';

  $('#meInfo').textContent = ME ? `${ME.login_id}${ME.position ? ' · ' + ME.position : ''} · ${ME.role_name}` : '';
  $('#menuMembers').hidden = !m;

  const v = $('#view');
  if (state.loading[state.tab]){ v.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
  if (state.error){
    v.innerHTML = `<div class="empty"><h3>문제가 생겼어요</h3><p>${esc(state.error)}</p><button class="btn" data-act="refresh">다시 시도</button></div>`;
    return;
  }
  v.innerHTML = state.tab === 'sch' ? renderSch() : state.tab === 'duty' ? renderDuty() : renderPray();
}

/* =====================  모달 공통  ===================== */
let askCancel = null;
function showModal({ title, body, footer = '', sticky = false, layer = 1 }){
  const root = $(layer === 2 ? '#modalRoot2' : '#modalRoot');
  root.innerHTML = `<div class="overlay ${layer === 2 ? 'l2' : ''}" ${sticky ? '' : `data-overlay="${layer}"`}>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="dlg-head"><h2>${esc(title)}</h2><button class="x" data-close="${layer}" aria-label="닫기">✕</button></div>
      <div class="dlg-body">${body}</div>${footer ? `<div class="dlg-foot">${footer}</div>` : ''}
    </div></div>`;
  document.body.classList.add('lock');
  const f = root.querySelector('[autofocus]'); if (f) f.focus();
}
function closeModal(layer = 1){
  if (layer === 2 || layer === 'all'){ if (askCancel){ const c = askCancel; askCancel = null; c(); } $('#modalRoot2').innerHTML = ''; }
  if (layer === 1 || layer === 'all') $('#modalRoot').innerHTML = '';
  if (!$('#modalRoot .overlay') && !$('#modalRoot2 .overlay')) document.body.classList.remove('lock');
}
const modalOpen = () => !!($('#modalRoot .overlay') || $('#modalRoot2 .overlay'));

// 확인 / 입력 창 (layer 2)
function askBox({ title, message = '', input = null, ok = '확인', danger = false }){
  return new Promise(resolve => {
    askCancel = () => resolve(input ? null : false);
    showModal({
      title, layer: 2, sticky: true,
      body: `<form id="askf" novalidate>${message ? `<p style="padding:6px 0 10px;line-height:1.7">${message}</p>` : ''}
        ${input ? `<input class="in" id="ask-in" type="${input.type || 'text'}" placeholder="${esc(input.placeholder || '')}" autocomplete="off" autofocus>` : ''}</form>`,
      footer: `<span class="grow"></span><button class="btn" type="button" id="ask-no">취소</button>
        <button class="btn ${danger ? 'dangerfill' : 'primary'}" type="submit" form="askf">${ok}</button>`
    });
    const done = v => { askCancel = null; closeModal(2); resolve(v); };
    $('#askf').addEventListener('submit', e => { e.preventDefault(); done(input ? ($('#ask-in').value.trim() || null) : true); });
    $('#ask-no').addEventListener('click', () => done(input ? null : false));
  });
}

const TABLE = { sch: 'schedules', duty: 'duty_schedule', pray: 'prayer_schedule' };
const LABEL = { sch: '일정', duty: '당직', pray: '기도 담당' };
async function doDelete(kind, id){
  if (!await askBox({ title: `${LABEL[kind]} 삭제`, message: '정말 삭제할까요?<br><span class="muted">삭제하면 되돌릴 수 없어요.</span>', ok: '삭제', danger: true })) return;
  try { await mutate(sb.from(TABLE[kind]).delete().eq('id', id)); } catch { return; }
  closeModal('all'); toast('삭제했어요'); LOADERS[kind]();
}
async function moveRow(kind, id, d){
  const list = kind === 'duty' ? state.duties : prayList();
  const i = list.findIndex(x => x.id === id), j = i + d;
  if (j < 0 || j >= list.length) return toast(d < 0 ? '맨 위입니다' : '맨 아래입니다', 'bad');
  const a = list[i], b = list[j];
  const fields = kind === 'duty' ? ['worker_name'] : ['worker1', 'worker2'];
  const pa = {}, pb = {};
  fields.forEach(f => { pa[f] = b[f]; pb[f] = a[f]; });
  try {
    await Promise.all([
      mutate(sb.from(TABLE[kind]).update({ ...pa, ...editMeta(a, pa) }).eq('id', a.id)),
      mutate(sb.from(TABLE[kind]).update({ ...pb, ...editMeta(b, pb) }).eq('id', b.id))
    ]);
  } catch { return; }
  closeModal('all'); toast(kind === 'duty' ? '당직자를 교환했어요' : '담당자를 교환했어요'); LOADERS[kind]();
}
async function rotateFrom(kind, id){
  if (kind === 'duty'){
    if (!state.workers.length) return toast('먼저 당직자를 등록해 주세요', 'bad');
    const i = state.duties.findIndex(x => x.id === id), n = state.workers.length;
    let idx = state.workers.findIndex(w => w.name === state.duties[i].worker_name); if (idx < 0) idx = 0;
    const targets = state.duties.slice(i);
    if (!await askBox({ title: '순환 재배정', message: `선택한 행부터 ${targets.length}건의 당직자를<br>등록된 기본 순서대로 다시 배정할까요?`, ok: '재배정' })) return;
    try {
      await Promise.all(targets.map((r, k) => {
        const nn = state.workers[(idx + k) % n].name;
        if (nn === r.worker_name) return null;
        return mutate(sb.from('duty_schedule').update({ worker_name: nn, ...editMeta(r, { worker_name: nn }) }).eq('id', r.id));
      }));
    } catch { return; }
    closeModal('all'); toast('재배정했어요'); loadDuty();
  } else {
    if (!state.prWorkers.length) return toast('먼저 담당자를 등록해 주세요', 'bad');
    const list = prayList(), i = list.findIndex(x => x.id === id), n = state.prWorkers.length;
    let idx = state.prWorkers.findIndex(w => w.name === list[i].worker1); if (idx < 0) idx = 0;
    const targets = list.slice(i);
    if (!await askBox({ title: '순환 재배정', message: `선택한 행부터 ${targets.length}건을<br>기본 순서대로 2명씩 다시 배정할까요?`, ok: '재배정' })) return;
    try {
      await Promise.all(targets.map(r => {
        const w1 = state.prWorkers[idx % n].name; idx++;
        let w2 = ''; if (n > 1){ w2 = state.prWorkers[idx % n].name; idx++; }
        if (w1 === r.worker1 && w2 === (r.worker2 || '')) return null;
        const p = { worker1: w1, worker2: w2 };
        return mutate(sb.from('prayer_schedule').update({ ...p, ...editMeta(r, p) }).eq('id', r.id));
      }));
    } catch { return; }
    closeModal('all'); toast('재배정했어요'); loadPray();
  }
}

const ROSTER = {
  cat:  { table: 'categories',     title: '항목 관리 · 우선순위', ph: '새 항목 이름', get: () => state.cats,      note: '항목을 누른 뒤 ▲▼ 로 우선순위(위가 높음)를 조정하고 [저장]을 누르세요. 항목을 삭제해도 기존 일정은 남고 항목만 비워집니다.' },
  duty: { table: 'duty_workers',   title: '당직자 명단 · 기본 순서', ph: '새 당직자 이름', get: () => state.workers,   note: '당직자를 누른 뒤 ▲▼ 로 순서를 바꾸고 [저장]을 누르세요. 월요일 일괄 생성과 재배정은 이 순서를 따릅니다.' },
  pray: { table: 'prayer_workers', title: '기도 담당자 명단 · 기본 순서', ph: '새 담당자 이름', get: () => state.prWorkers, note: '담당자를 누른 뒤 ▲▼ 로 순서를 바꾸고 [저장]을 누르세요. 기간 일괄 생성과 재배정은 이 순서를 따릅니다.' }
};
const ros = { kind: null, work: [], sel: null };
function renderRoster(){
  $('#rosList').innerHTML = ros.work.length
    ? ros.work.map((w, i) => `<div class="item ${i === ros.sel ? 'sel' : ''}" data-ri="${i}"><b>${i + 1}</b><span>${esc(w.name)}</span></div>`).join('')
    : '<div class="empty" style="padding:24px">등록된 항목이 없습니다</div>';
}
function openRoster(kind){
  const R = ROSTER[kind];
  ros.kind = kind; ros.work = R.get().map(w => ({ id: w.id, name: w.name })); ros.sel = null;
  showModal({
    title: R.title, layer: 2, sticky: true,
    body: `<div class="inl" style="margin-bottom:12px"><input class="in" id="rosNew" maxlength="30" placeholder="${R.ph}"><button class="btn" type="button" id="rosAdd">추가</button></div>
      <div id="rosList"></div><p class="note">${R.note}</p>`,
    footer: `<button class="btn sm" type="button" id="rosUp" style="width:48px">▲</button><button class="btn sm" type="button" id="rosDown" style="width:48px">▼</button>
      <button class="btn danger sm" type="button" id="rosDel">삭제</button><span class="grow"></span>
      <button class="btn" type="button" data-close="2">닫기</button><button class="btn primary" type="button" id="rosSave">저장</button>`
  });
  renderRoster();
}
function rosterAdd(){
  const n = $('#rosNew').value.trim(); if (!n) return;
  if (ros.work.some(w => w.name === n)) return toast('이미 있는 이름입니다', 'bad');
  ros.work.push({ id: null, name: n }); $('#rosNew').value = ''; ros.sel = ros.work.length - 1; renderRoster();
}
function rosterMove(d){
  if (ros.sel === null) return toast('먼저 항목을 선택해 주세요', 'bad');
  const j = ros.sel + d; if (j < 0 || j >= ros.work.length) return;
  [ros.work[ros.sel], ros.work[j]] = [ros.work[j], ros.work[ros.sel]]; ros.sel = j; renderRoster();
}
function rosterDel(){
  if (ros.sel === null) return toast('먼저 항목을 선택해 주세요', 'bad');
  ros.work.splice(ros.sel, 1); ros.sel = null; renderRoster();
}
async function rosterSave(){
  const R = ROSTER[ros.kind], old = R.get();
  try {
    const keep = ros.work.filter(w => w.id).map(w => w.id);
    const del = old.filter(w => !keep.includes(w.id)).map(w => w.id);
    if (del.length) await run(sb.from(R.table).delete().in('id', del));
    for (let i = 0; i < ros.work.length; i++){
      const w = ros.work[i];
      if (w.id) await run(sb.from(R.table).update({ sort_order: i }).eq('id', w.id));
      else await run(sb.from(R.table).insert({ name: w.name, sort_order: i }));
    }
  } catch { return; }
  toast('저장했어요');
  const kind = ros.kind;
  closeModal(2);
  if (kind === 'cat'){
    await loadSch();
    const sel = $('#f-cat'); if (sel) sel.innerHTML = catOptions(sel.value ? Number(sel.value) : null);
  } else if (kind === 'duty') loadDuty(); else loadPray();
}

/* =====================  일괄 생성  ===================== */
function dutyGenStart(){
  const prev = state.duties.length ? state.duties[state.duties.length - 1] : null;
  const [y, m, d] = (prev ? prev.duty_date : today()).split('-').map(Number);
  const s = new Date(y, m - 1, d);
  s.setDate(s.getDate() + (((8 - s.getDay()) % 7) || 7));     // 기준일보다 뒤의 첫 월요일
  return { start: s, prev };
}
function openGenDuty(){
  if (!state.workers.length) return toast('먼저 당직자를 등록해 주세요', 'bad');
  const { start, prev } = dutyGenStart();
  const dp = state.presets.find(p => p.is_default);
  showModal({
    title: '월요일 일괄 생성', sticky: true,

async function submitGenDuty(){
  const err = m => { $('#ferr').textContent = m; };
  const weeks = Number($('#g-weeks').value);
  if (!Number.isInteger(weeks) || weeks < 1 || weeks > 12) return err('주 수는 1~12 사이로 입력해 주세요.');
  const { start, prev } = dutyGenStart(), n = state.workers.length;
  const pick = $('#g-start').value;
  let idx = pick !== '' ? state.workers.findIndex(w => String(w.id) === pick)
          : prev ? state.workers.findIndex(w => w.name === prev.worker_name) + 1 : 0;
  if (idx < 0) idx = 0;
  const exist = new Set(state.duties.map(r => r.duty_date)), rows = [];
  for (let w = 0; w < weeks; w++){
    const s = toStr(addDays(7 * w, start));
    if (exist.has(s)) continue;
    rows.push({ duty_date: s, start_time: $('#g-s').value || '09:00', end_time: $('#g-e').value || '17:00', worker_name: state.workers[idx % n].name, updated_by: CID });

  if (!await askBox({ title: '일괄 생성', message: `${dot(rows[0].duty_date)} ~ ${dot(rows[rows.length - 1].duty_date)}<br>월요일 ${rows.length}건을 생성할까요?`, ok: '생성' })) return;
  $('#f-save').disabled = true;
  try { await run(sb.from('duty_schedule').insert(rows)); } catch { $('#f-save').disabled = false; return; }
  closeModal('all'); toast(`${rows.length}건 생성했어요`); loadDuty();
}

async function submitGenPray(form){
  const err = m => { $('#ferr').textContent = m; };
  const from = $('#g-from').value, to = $('#g-to').value;
  if (!from || !to || from > to) return err('기간을 올바르게 선택해 주세요.');
  const c = form.querySelector('input[name=g-pcat]:checked').value, W = state.prWorkers, n = W.length;
  const pick = $('#g-pstart').value;
  let idx;
  if (pick !== '') idx = W.findIndex(w => String(w.id) === pick);
  else {
    const prev = state.prRows.filter(r => r.category === c && r.pray_date < from).pop();
    const last = prev ? (prev.worker2 || prev.worker1) : null;
    idx = last ? W.findIndex(w => w.name === last) + 1 : 0;
  }
  if (idx < 0) idx = 0;
  const exist = new Set(state.prRows.filter(r => r.category === c).map(r => r.pray_date)), rows = [];
  for (let d = parse(from); toStr(d) <= to; d.setDate(d.getDate() + 1)){
    const s = toStr(d); if (exist.has(s)) continue;
    const w1 = W[idx % n].name; idx++;
    let w2 = ''; if (n > 1){ w2 = W[idx % n].name; idx++; }
    rows.push({ pray_date: s, category: c, worker1: w1, worker2: w2, updated_by: CID });
  }
  if (!rows.length) return err('생성할 날짜가 없습니다.');
  if (rows.length > 366) return err('한 번에 366일까지만 생성할 수 있어요.');
  if (!await askBox({ title: '일괄 생성', message: `${c} ${rows.length}일치를 생성할까요?`, ok: '생성' })) return;
  $('#f-save').disabled = true;
  try { await run(sb.from('prayer_schedule').insert(rows)); } catch { $('#f-save').disabled = false; return; }
  state.prayCat = c; ls.set('prayCat', c);
  closeModal('all'); toast(`${rows.length}건 생성했어요`); loadPray();
}
function openPast(){

/* =====================  알림 / 실시간  ===================== */
// 알림 형식: 1줄 "교회 스케줄 알림. (추가)" / 2줄 제목 / 3줄 내용
async function notify(head, line2, line3){
  const body = [line2, line3].filter(Boolean).join('\n');
  toast(head + '\n' + body);
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    const opt = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'church-' + Date.now() };
    if ('serviceWorker' in navigator){            // 안드로이드 크롬은 서비스워커로 띄워야 함
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) return reg.showNotification(head, opt);
    }
    new Notification(head, opt);
  } catch {}
}
async function askNotify(){
  if (!('Notification' in window)) return toast('이 브라우저는 알림을 지원하지 않아요. 크롬에서 설치한 앱으로 열어 보세요.', 'bad');
  const r = await Notification.requestPermission();
  if (r !== 'granted') return toast('알림이 차단되었어요. 브라우저 사이트 설정에서 허용해 주세요.', 'bad');
  toast('알림을 허용했어요. 3초 뒤 테스트 알림을 보냅니다.\n앱을 닫거나 다른 화면으로 나가 보세요.');
  setTimeout(async () => {
    try {
      const reg = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
      const opt = { body: '테스트 제목\n테스트 내용', icon: 'icon-192.png', tag: 'church-test' };
      if (reg) reg.showNotification('교회 스케줄 알림. (테스트)', opt); else new Notification('교회 스케줄 알림. (테스트)', opt);
    } catch (e) { toast('알림 표시 실패: ' + e.message, 'bad'); }
  }, 3000);
}
let rtTimer;
function startRealtime(){
  if (!sb) return;
  const refresh = k => { clearTimeout(rtTimer); rtTimer = setTimeout(() => LOADERS[k](), 300); };
  sb.channel('rt-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'schedules' }, pl => {
      refresh('sch');
      const r = pl.new || {};
      if (pl.eventType === 'DELETE' || r.updated_by === CID) return;
      let act = '추가';
      if (pl.eventType === 'UPDATE'){
        const edited = r.updated_at && Date.now() - new Date(r.updated_at) < 15000;
        act = edited ? '수정' : (r.done ? '완료' : '완료 해제');
      }
      notify(`교회 스케줄 알림. (${act})`, r.title, clip(r.content));
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'duty_schedule' }, pl => {
      refresh('duty');
      const r = pl.new || {};
      if (pl.eventType === 'DELETE' || r.updated_by === CID) return;
      notify(`교회 당직 알림. (${pl.eventType === 'INSERT' ? '추가' : '수정'})`, dot(r.duty_date || ''), `${fmtT(r.start_time)} ~ ${fmtT(r.end_time)}  ${r.worker_name || ''}`);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'prayer_schedule' }, pl => {
      refresh('pray');
      const r = pl.new || {};
      if (pl.eventType === 'DELETE' || r.updated_by === CID) return;
      notify(`교회 기도 알림. (${r.category || ''} ${pl.eventType === 'INSERT' ? '추가' : '수정'})`, `${dot(r.pray_date || '')} (${wday(r.pray_date)})`, prNames(r));
    })
    .subscribe();
}

let downOnOverlay = false;
document.addEventListener('mousedown', e => { downOnOverlay = !!e.target.matches?.('[data-overlay]'); });

document.addEventListener('click', async e => {
  const t = e.target, c = s => t.closest(s);
  let x;
  if (!c('.menu-wrap')) $('#menu').hidden = true;

  if (t.matches('[data-overlay]')){ if (downOnOverlay) closeModal(Number(t.dataset.overlay)); return; }
  if ((x = c('[data-close]'))){ closeModal(Number(x.dataset.close)); return; }

  // 표 / 카드 조작
  if ((x = c('[data-toggle]'))){ e.stopPropagation(); await toggleDone(+x.dataset.toggle); return; }
  if ((x = c('[data-toggle-d]'))){ const id = +x.dataset.toggleD; if (await toggleDone(id)){ closeModal('all'); } return; }
  if ((x = c('[data-del]'))){ await doDelete(x.dataset.kind, +x.dataset.del); return; }
  if ((x = c('[data-edit]'))){
    const id = +x.dataset.edit, k = x.dataset.kind;
    if (k === 'sch') openSchForm(state.sch.find(r => r.id === id));
    else if (k === 'duty') openDutyForm(state.duties.find(r => r.id === id));
    else openPrayForm(state.prRows.find(r => r.id === id));
    return;
  }
  if ((x = c('[data-move]'))){ await moveRow(x.dataset.kind, +x.dataset.id, +x.dataset.move); return; }
  if ((x = c('[data-rotate]'))){ await rotateFrom(x.dataset.kind, +x.dataset.id); return; }
  if ((x = c('[data-open]'))){ openDetail(x.dataset.kind, +x.dataset.open); return; }

  // 새로 만들기
  if (c('[data-new]')){
    if (!isMaster()) return;
    if (state.tab === 'sch') openSchForm(); else if (state.tab === 'duty') openDutyForm(); else openPrayForm();
    return;
  }

  // 폼 안의 보조 버튼

    $('#f-due').value = today(); $('#f-cat').value = ''; $('#f-title').value = ''; $('#f-content').value = ''; $('#ferr').textContent = ''; $('#f-title').focus();

  if (c('#rosAdd')){ rosterAdd(); return; }
  if (c('#rosUp')){ rosterMove(-1); return; }
  if (c('#rosDown')){ rosterMove(1); return; }

  if (c('#rosSave')){ await rosterSave(); return; }
  if ((x = c('[data-ri]'))){ ros.sel = Number(x.dataset.ri); renderRoster(); return; }

  // 회원 관리 모달 내부
  if ((x = c('[data-mem]'))){
    const id = Number(x.closest('.mem').dataset.id);
    try {
      if (x.dataset.mem === 'pw'){

        if (!pw) return;
        await rpc('app_reset_password', { p_member_id: id, p_new_pw: pw }); toast('비밀번호를 초기화했어요');
      } else {
        if (!await askBox({ title: '회원 삭제', message: '이 회원을 삭제할까요?', ok: '삭제', danger: true })) return;
        await rpc('app_delete_member', { p_member_id: id }); toast('삭제했어요');
      }
    } catch (err) { toast('오류: ' + err.message, 'bad'); }

  }
  if (c('#btnMenu')){ const m = $('#menu'); m.hidden = !m.hidden; return; }
  if ((x = c('[data-act]'))){
    $('#menu').hidden = true;
    switch (x.dataset.act){
      case 'refresh': state.loading[state.tab] = true; state.error = null; render(); LOADERS[state.tab](); break;
      case 'notify': askNotify(); break;
      case 'members': openMembers(); break;
      case 'logout': doLogout(); break;
      case 'cats': if (isMaster()) openRoster('cat'); break;
      case 'roster-duty': if (isMaster()) openRoster('duty'); break;
      case 'roster-pray': if (isMaster()) openRoster('pray'); break;
      case 'gen-duty': if (isMaster()) openGenDuty(); break;
      case 'gen-pray': if (isMaster()) openGenPray(); break;
      case 'past-pray': openPast(); break;
    }
  }
});

document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'fs'){ e.preventDefault(); submitSch(e.target); }
  else if (id === 'fd'){ e.preventDefault(); submitDuty(e.target); }
  else if (id === 'fp'){ e.preventDefault(); submitPray(e.target); }
  else if (id === 'gd'){ e.preventDefault(); submitGenDuty(); }
  else if (id === 'gp'){ e.preventDefault(); submitGenPray(e.target); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'f-preset'){
    const p = state.presets.find(x => String(x.id) === e.target.value);
    if (p){ $('#f-start').value = p.start_time; $('#f-end').value = p.end_time; }
  } else if (e.target.matches('[data-role]')){
    const id = Number(e.target.closest('.mem').dataset.id);
    rpc('app_set_role', { p_member_id: id, p_role_id: Number(e.target.value) })
      .then(() => toast('권한을 변경했어요'), err => toast('오류: ' + err.message, 'bad'))
      .then(async () => { await loadMembers(); await refreshMe(); if (!isMaster()) closeModal('all'); });
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rosNew') return;
  if (e.target.id === 'q'){ state.q = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalOpen()){ closeModal($('#modalRoot2 .overlay') ? 2 : 1); return; }
  if (e.key === 'Enter' && e.target.id === 'rosNew'){ e.preventDefault(); rosterAdd(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-open]') && !modalOpen()){
    e.preventDefault(); openDetail(e.target.dataset.kind, +e.target.dataset.open);
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !ME || $('#app').hidden) return;
  refreshMe();
  if (!modalOpen() && Date.now() - state.loadedAt > 30000) LOADERS[state.tab]();
});
setInterval(() => { if (!$('#app').hidden) render(); }, 60000);   // 24시간이 지나면 NEW / 하이라이트 자동 해제

/* =====================  시작  ===================== */
boot();

/* ---------- PWA: 서비스워커 등록 (https 또는 localhost 에서만 동작) ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
